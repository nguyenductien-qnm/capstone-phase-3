# `promtool test rules` — chung minh bang so mot quyet dinh thiet ke cua rule burn-rate:
# vi sao dung idiom min() `(A_short < A_long) or (A_long)` chu KHONG dung `and`.
#
# Chay: promtool test rules aiops/detector/promql_tests/burn_rate_test.yml
# (test_detector.py::test_promtool_burn_rate goi ho, tu skip neu may khong co promtool)
#
# BOI CANH. PR #318 (da dong) de xuat viet lai 4 rule burn-rate bang `and`:
#     (burn_5m) and (burn_1h > 14.4)
# Ve dieu kien FIRE thi hai cach TUONG DUONG — ca hai deu chi keu khi CA HAI cua so vuot
# nguong. Khac nhau nam o cho chung tra ve gi khi CHUA vuot:
#
#   - `and`  : tra ve CHUOI RONG. Tuc "im lang" la trang thai BINH THUONG cua rule.
#   - `min()`: van tra ve mot gia tri. Tuc "im lang" chi co the nghia la MU.
#
# Vi sao cho khac biet do quan trong hon no tuong: detector co co che `detector-silent-rule`
# (detector.py::silent_rule_note) bao dong khi mot rule tra ve 0 series suot 120 chu ky —
# co che nay chinh la thu phat hien 8/17 rule dang mu ngay 28/07. Neu rule burn-rate dung
# `and`, no se im lang suot trong mot he KHOE, nen phai dat `expect_series: false` de khoi
# bao dong gia — va the la mat luon kha nang phan biet "rule mu" voi "he khoe". Do dung la
# lop loi da lam rule `kafka-consumer-lag-high` nam cam hang tuan ma khong ai biet.
#
# Hai ca duoi day do chinh xac dieu do.

evaluation_interval: 1m

tests:
  # ---------------------------------------------------------------------------
  # CA 1 — he KHOE (burn rate 1.98x, duoi nguong 14.4x).
  # Ky vong: min() VAN bao mot so; `and` tra ve RONG.
  # ---------------------------------------------------------------------------
  - interval: 1m
    name: "he khoe duoi nguong — min() van bao so, and im lang"
    input_series:
      # 6000 call OK/phut = 100/s, tuyen tinh nen rate() cho ra so chan.
      - series: 'traces_span_metrics_calls_total{service_name="cart", status_code="STATUS_CODE_OK", span_name="Get", span_kind="SPAN_KIND_SERVER"}'
        values: '0+6000x120'
      # 60 call loi/phut = 1/s  ->  ti le loi = 1/101 = 0.009901
      # burn rate = 0.009901 / 0.005 (budget SLO 99.5%) = 1.9802x
      - series: 'traces_span_metrics_calls_total{service_name="cart", status_code="STATUS_CODE_ERROR", span_name="Get", span_kind="SPAN_KIND_SERVER"}'
        values: '0+60x120'

    promql_expr_test:
      # --- Cach DANG DUNG: min(burn_5m, burn_1h) ---
      - expr: >-
          (
            (
              sum by (service_name) (rate(traces_span_metrics_calls_total{
                status_code="STATUS_CODE_ERROR", service_name!="checkout",
                span_name!="grpc.health.v1.Health/Check",
                span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[5m]))
              / clamp_min(sum by (service_name) (rate(traces_span_metrics_calls_total{
                service_name!="checkout",
                span_name!="grpc.health.v1.Health/Check",
                span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[5m])), 0.001)
            ) / 0.005
            <
            (
              sum by (service_name) (rate(traces_span_metrics_calls_total{
                status_code="STATUS_CODE_ERROR", service_name!="checkout",
                span_name!="grpc.health.v1.Health/Check",
                span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[1h]))
              / clamp_min(sum by (service_name) (rate(traces_span_metrics_calls_total{
                service_name!="checkout",
                span_name!="grpc.health.v1.Health/Check",
                span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[1h])), 0.001)
            ) / 0.005
          )
          or
          (
            (
              sum by (service_name) (rate(traces_span_metrics_calls_total{
                status_code="STATUS_CODE_ERROR", service_name!="checkout",
                span_name!="grpc.health.v1.Health/Check",
                span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[1h]))
              / clamp_min(sum by (service_name) (rate(traces_span_metrics_calls_total{
                service_name!="checkout",
                span_name!="grpc.health.v1.Health/Check",
                span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[1h])), 0.001)
            ) / 0.005
          )
        eval_time: 120m
        exp_samples:
          # Co gia tri => `expect_series: true` con y nghia; im lang o day se la MU that.
          - labels: '{service_name="cart"}'
            value: 1.9801980198019802

      # --- Cach cua PR #318: `and` — RONG khi chua vuot nguong ---
      - expr: >-
          (
            (
              sum by (service_name) (rate(traces_span_metrics_calls_total{
                status_code="STATUS_CODE_ERROR", service_name!="checkout",
                span_name!="grpc.health.v1.Health/Check",
                span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[5m]))
              / clamp_min(sum by (service_name) (rate(traces_span_metrics_calls_total{
                service_name!="checkout",
                span_name!="grpc.health.v1.Health/Check",
                span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[5m])), 0.001)
            ) / 0.005
          )
          and
          (
            (
              sum by (service_name) (rate(traces_span_metrics_calls_total{
                status_code="STATUS_CODE_ERROR", service_name!="checkout",
                span_name!="grpc.health.v1.Health/Check",
                span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[1h]))
              / clamp_min(sum by (service_name) (rate(traces_span_metrics_calls_total{
                service_name!="checkout",
                span_name!="grpc.health.v1.Health/Check",
                span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[1h])), 0.001)
            ) / 0.005 > 14.4
          )
        eval_time: 120m
        # RONG. Day la ca lam `detector-silent-rule` mat tac dung neu chon `and`.
        exp_samples: []

  # ---------------------------------------------------------------------------
  # CA 2 — he HONG THAT (burn rate 18.18x, tren nguong 14.4x).
  # Ky vong: hai cach cho CUNG mot so. Khac biet o ca 1 khong phai la khac biet ve
  # kha nang phat hien — chi la khac biet ve kha nang QUAN SAT rule.
  # ---------------------------------------------------------------------------
  - interval: 1m
    name: "vuot nguong — min() va and cho cung ket qua"
    input_series:
      - series: 'traces_span_metrics_calls_total{service_name="cart", status_code="STATUS_CODE_OK", span_name="Get", span_kind="SPAN_KIND_SERVER"}'
        values: '0+6000x120'
      # 600 call loi/phut = 10/s -> ti le = 10/110 = 0.090909 -> burn = 18.1818x
      - series: 'traces_span_metrics_calls_total{service_name="cart", status_code="STATUS_CODE_ERROR", span_name="Get", span_kind="SPAN_KIND_SERVER"}'
        values: '0+600x120'

    promql_expr_test:
      - expr: >-
          (
            (
              sum by (service_name) (rate(traces_span_metrics_calls_total{
                status_code="STATUS_CODE_ERROR", service_name!="checkout",
                span_name!="grpc.health.v1.Health/Check",
                span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[5m]))
              / clamp_min(sum by (service_name) (rate(traces_span_metrics_calls_total{
                service_name!="checkout",
                span_name!="grpc.health.v1.Health/Check",
                span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[5m])), 0.001)
            ) / 0.005
            <
            (
              sum by (service_name) (rate(traces_span_metrics_calls_total{
                status_code="STATUS_CODE_ERROR", service_name!="checkout",
                span_name!="grpc.health.v1.Health/Check",
                span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[1h]))
              / clamp_min(sum by (service_name) (rate(traces_span_metrics_calls_total{
                service_name!="checkout",
                span_name!="grpc.health.v1.Health/Check",
                span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[1h])), 0.001)
            ) / 0.005
          )
          or
          (
            (
              sum by (service_name) (rate(traces_span_metrics_calls_total{
                status_code="STATUS_CODE_ERROR", service_name!="checkout",
                span_name!="grpc.health.v1.Health/Check",
                span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[1h]))
              / clamp_min(sum by (service_name) (rate(traces_span_metrics_calls_total{
                service_name!="checkout",
                span_name!="grpc.health.v1.Health/Check",
                span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[1h])), 0.001)
            ) / 0.005
          )
        eval_time: 120m
        exp_samples:
          - labels: '{service_name="cart"}'
            value: 18.181818181818183

      - expr: >-
          (
            (
              sum by (service_name) (rate(traces_span_metrics_calls_total{
                status_code="STATUS_CODE_ERROR", service_name!="checkout",
                span_name!="grpc.health.v1.Health/Check",
                span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[5m]))
              / clamp_min(sum by (service_name) (rate(traces_span_metrics_calls_total{
                service_name!="checkout",
                span_name!="grpc.health.v1.Health/Check",
                span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[5m])), 0.001)
            ) / 0.005
          )
          and
          (
            (
              sum by (service_name) (rate(traces_span_metrics_calls_total{
                status_code="STATUS_CODE_ERROR", service_name!="checkout",
                span_name!="grpc.health.v1.Health/Check",
                span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[1h]))
              / clamp_min(sum by (service_name) (rate(traces_span_metrics_calls_total{
                service_name!="checkout",
                span_name!="grpc.health.v1.Health/Check",
                span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[1h])), 0.001)
            ) / 0.005 > 14.4
          )
        eval_time: 120m
        exp_samples:
          - labels: '{service_name="cart"}'
            value: 18.181818181818183
