name: Platform CI

# CDO-145 (gate stage 0): secret scan + unit test + helm lint chạy trên MỌI push/PR.
# CDO-141: helm lint + template render làm gate validate manifest TRƯỚC khi deploy.
#
# Đây là gate rẻ, không cần AWS creds — fail sớm để chặn code lỗi/lộ secret trước khi
# tới các workflow tốn kém (app-build push ECR, infra-cd apply).

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ #
  # CDO-145: Secret scan toàn repo. Quét full history trên push;       #
  # trên PR chỉ quét diff (nhanh + đủ để chặn secret mới thêm).        #
  # ------------------------------------------------------------------ #
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # fetch full history để gitleaks quét được toàn bộ commit trên push.
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------ #
  # MANDATE-10 #4: "GitHub Action pin theo commit SHA; base image pin   #
  # theo digest. Không @latest, không @master, không tag trôi."         #
  #                                                                    #
  # Trước job này, bằng chứng cho #4 chỉ là hai lệnh grep chạy TAY —    #
  # chứng minh được "hiện đang pin", KHÔNG chứng minh được "không trôi  #
  # lại được". Ai thêm một action pin theo tag ngày mai thì không gì    #
  # chặn lại.                                                          #
  # Đây là chỗ biến một lần đo thành một cổng thường trực.              #
  #                                                                    #
  # Vì sao đặt trong platform-ci.yaml chứ không tách file: workflow này #
  # KHÔNG có paths filter nên chạy trên mọi PR — điều kiện bắt buộc để  #
  # một check được đưa vào required status checks mà không treo         #
  # Expected. Bài học từ 26/07: thêm required check mà job không chạy   #
  # trên PR nào đó = PR kẹt vĩnh viễn.                                  #
  # ------------------------------------------------------------------ #
  pin-guard:
    name: Pin guard (action SHA + base image digest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Action phải pin theo commit SHA
        run: |
          set -euo pipefail
          # Chỉ xét `uses:` là KHOÁ YAML thật, tức đứng đầu dòng (sau khoảng trắng)
          # hoặc sau `- `. Bỏ qua mọi dòng comment: chính file này có ví dụ minh hoạ
          # trong comment, nếu quét cả comment thì gate tự bắt lỗi của chính nó.
          # `uses: ./...` là workflow/action nội bộ trong repo — không có gì để trôi.
          uses_lines() {
            grep -rHn -E "^[[:space:]]*(-[[:space:]]+)?uses:" .github/workflows/*.yaml \
              | grep -v "uses: \./"
          }
          bad=$(uses_lines | grep -E "@(v[0-9]|main|master|latest)" || true)
          total=$(uses_lines | wc -l)
          if [ -n "$bad" ]; then
            echo "::error::Có action chưa pin theo commit SHA. Tag như @v4 di chuyển được:"
            echo "$bad"
            echo ""
            echo "Sửa: thay @v4 bằng SHA đầy đủ 40 ký tự, ghi tag cũ vào comment cuối dòng."
            echo "Lấy SHA: gh api repos/<owner>/<repo>/commits/<tag> --jq .sha"
            exit 1
          fi
          echo "✅ $total/$total action pin theo commit SHA."

      - name: Base image phải pin theo digest
        run: |
          set -euo pipefail
          # Ba dạng FROM KHÔNG cần digest, và lý do:
          #   FROM <stage>          tham chiếu stage đã khai trong CÙNG Dockerfile
          #                         (`FROM base`, `FROM builder`) — không kéo gì từ registry.
          #   FROM scratch          image rỗng do BuildKit dựng, không có digest.
          #   FROM ${ARG}          giá trị thật nằm ở dòng ARG; bước dưới xét riêng.
          stages=$(grep -rhoP '(?<=^FROM )\S+(?=\s+AS\s+\S+)|(?<= AS )\S+' \
                     --include=Dockerfile -r . 2>/dev/null | sort -u || true)

          bad=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            file=${line%%:*}; rest=${line#*:}
            ref=$(printf '%s' "$rest" | awk '{print $2}')
            case "$ref" in
              *@sha256:*) continue ;;
              scratch)    continue ;;
              '${'*|*'$'*) continue ;;   # ARG — bước sau lo
            esac
            # Trỏ tới stage nội bộ trong cùng file?
            if printf '%s\n' "$stages" | grep -qx "$ref"; then continue; fi
            bad="${bad}${line}"$'\n'
          done < <(grep -rHn "^FROM " --include=Dockerfile -r . 2>/dev/null || true)

          total=$(grep -rh "^FROM " --include=Dockerfile -r . 2>/dev/null | wc -l)
          pinned=$(grep -rh "^FROM " --include=Dockerfile -r . 2>/dev/null | grep -c "@sha256:" || true)
          if [ -n "$bad" ]; then
            echo "::error::Có base image kéo từ registry mà chưa pin digest:"
            printf '%s' "$bad"
            echo ""
            echo "Sửa: thêm @sha256:<digest> sau tag."
            echo "Lấy digest: docker buildx imagetools inspect <image>:<tag> | grep Digest"
            exit 1
          fi
          echo "✅ $pinned/$total dòng FROM pin digest; phần còn lại là stage nội bộ hoặc scratch."

      - name: ARG image mặc định cũng phải pin digest
        run: |
          set -euo pipefail
          # Vì sao cần bước riêng: `FROM ${RUNNER_IMAGE}` nhìn qua thì "không phải
          # tag trôi", nhưng giá trị thật nằm ở dòng ARG. Nếu ARG mặc định là
          # `docker.io/debian:bullseye-slim` thì build vẫn kéo theo TAG — đúng thứ
          # yêu cầu #4 cấm, chỉ là giấu sau một lớp biến.
          # Chỉ xét ARG có giá trị trông như image ref (có "/" và ":") để không
          # bắt nhầm ARG phiên bản kiểu ARG GO_VERSION=1.25.
          bad=$(grep -rHnE '^ARG +[A-Z_]*(IMAGE|BASE)[A-Z_]*=.*/.*:' \
                  --include=Dockerfile -r . 2>/dev/null \
                | grep -v "@sha256:" || true)
          if [ -n "$bad" ]; then
            echo "::error::ARG image mặc định chưa pin digest — build sẽ kéo theo tag:"
            echo "$bad"
            echo ""
            echo "Sửa một trong hai cách:"
            echo "  1. Thêm @sha256:<digest> vào giá trị mặc định của ARG, hoặc"
            echo "  2. Truyền --build-arg <TÊN>=<image>@sha256:<digest> từ CI."
            exit 1
          fi
          echo "✅ Mọi ARG image mặc định đều pin digest."

  # ------------------------------------------------------------------ #
  # CDO-145: Dò service nào có unit test chạy được + đổi code trong PR. #
  #                                                                    #
  # Trước đây matrix liệt kê tay [checkout, product-catalog] nên hỏng   #
  # 2 đằng: product-catalog KHÔNG có file _test.go nào (check luôn      #
  # xanh, không bao giờ đỏ được), còn 12 file test của product-reviews/ #
  # shopping-copilot/cart viết ra thì không ai chạy vì không có tên     #
  # trong matrix. Dò tự động chấm dứt cả hai — thêm test mới là tự vào  #
  # gate, hết test là tự rơi ra, không phải sửa file này nữa.           #
  # ------------------------------------------------------------------ #
  discover:
    name: Dò service có test
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.scan.outputs.go }}
      py: ${{ steps.scan.outputs.py }}
      cs: ${{ steps.scan.outputs.cs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # cần lịch sử để diff được với nhánh đích của PR
          fetch-depth: 0
      - id: scan
        run: |
          # push (không có base_ref) -> quét toàn bộ, không lọc diff.
          .github/scripts/discover-tests.sh "${{ github.event.pull_request.base.sha }}"

  # ------------------------------------------------------------------ #
  # Go: go vet + go test -race. Chỉ chạy service vừa có go.mod vừa có   #
  # ít nhất 1 file _test.go.                                           #
  # ------------------------------------------------------------------ #
  unit-test-go:
    name: Unit test Go (${{ matrix.service }})
    needs: discover
    if: needs.discover.outputs.go != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.go) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: techx-corp-platform/src/${{ matrix.service }}/go.mod
          cache-dependency-path: techx-corp-platform/src/${{ matrix.service }}/go.sum
      - name: go vet
        working-directory: techx-corp-platform/src/${{ matrix.service }}
        run: go vet ./...
      - name: go test
        working-directory: techx-corp-platform/src/${{ matrix.service }}
        run: go test -race -count=1 ./...

  # ------------------------------------------------------------------ #
  # Python: pip install -r requirements.txt + pytest.                   #
  # Bước collect-only là bắt buộc — ml-guard/llm có file tên test_*.py  #
  # nhưng assert nằm ngoài hàm test_*, pytest thu 0 test rồi trả về     #
  # "no tests ran". Không chặn thì lại đẻ ra ô tích trống mới.          #
  # ------------------------------------------------------------------ #
  unit-test-python:
    name: Unit test Python (${{ matrix.service }})
    needs: discover
    if: needs.discover.outputs.py != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.py) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: techx-corp-platform/src/${{ matrix.service }}/requirements.txt
      - name: Cài dependency
        working-directory: techx-corp-platform/src/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Kiểm pytest có thu được test không
        working-directory: techx-corp-platform/src/${{ matrix.service }}
        run: |
          set -euo pipefail
          n=$(python -m pytest --collect-only -q 2>/dev/null | grep -cE '::' || true)
          if [ "$n" -eq 0 ]; then
            echo "::error::pytest không thu được test nào — file test_*.py phải có hàm tên test_*, xem issue #339."
            exit 1
          fi
          echo "✅ pytest thu được $n test"
      - name: pytest
        working-directory: techx-corp-platform/src/${{ matrix.service }}
        run: python -m pytest -q

  # ------------------------------------------------------------------ #
  # .NET: dotnet test project xunit. TargetFramework net10.0 (xem       #
  # cart/tests/cart.tests.csproj).                                      #
  # ------------------------------------------------------------------ #
  unit-test-dotnet:
    name: Unit test .NET (${{ matrix.service }})
    needs: discover
    if: needs.discover.outputs.cs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.cs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: dotnet test
        working-directory: techx-corp-platform/src/${{ matrix.service }}
        run: dotnet test --nologo --verbosity normal

  accounting-release-build:
    name: Accounting Release build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare shared checkout proto
        run: |
          mkdir -p techx-corp-platform/src/accounting/src/protos
          cp techx-corp-platform/pb/demo.proto \
             techx-corp-platform/src/accounting/src/protos/demo.proto
      - name: Restore Accounting
        working-directory: techx-corp-platform/src/accounting
        run: dotnet restore Accounting.csproj
      - name: Build Accounting (Release)
        working-directory: techx-corp-platform/src/accounting
        run: dotnet build Accounting.csproj --configuration Release --no-restore

  orders-migration-integration:
    name: Orders migration integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: PostgreSQL client version
        run: psql --version
      - name: Exercise forward, contract, and rollback migrations
        run: bash .github/scripts/test-orders-migration.sh

  # ------------------------------------------------------------------ #
  # Job gác cổng — ĐÂY mới là cái đặt vào required status checks, KHÔNG #
  # phải từng job con.                                                  #
  #                                                                    #
  # Lý do: matrix sinh động nên tên job đổi theo từng PR. Required      #
  # check là chuỗi cố định — PR không đụng service nào thì job đó không #
  # tồn tại, GitHub chờ mãi một check không bao giờ tới và PR treo ở    #
  # trạng thái Expected, không merge được. Job này luôn chạy nên tên    #
  # luôn ổn định; thêm service mới cũng không phải sửa ruleset.         #
  #                                                                    #
  # skipped = không service nào có test bị đổi -> hợp lệ, cho qua.      #
  # ------------------------------------------------------------------ #
  unit-test:
    name: Unit tests
    needs:
      - discover
      - unit-test-go
      - unit-test-python
      - unit-test-dotnet
      - accounting-release-build
      - orders-migration-integration
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tổng hợp kết quả
        run: |
          set -euo pipefail
          fail=0
          for r in "discover:${{ needs.discover.result }}" \
                   "go:${{ needs.unit-test-go.result }}" \
                   "python:${{ needs.unit-test-python.result }}" \
                   "dotnet:${{ needs.unit-test-dotnet.result }}" \
                   "accounting-release:${{ needs.accounting-release-build.result }}" \
                   "orders-migration:${{ needs.orders-migration-integration.result }}"; do
            name=${r%%:*}; res=${r#*:}
            case "$res" in
              success)  echo "✅ $name: $res" ;;
              skipped)  echo "⏭️  $name: không service nào cần chạy" ;;
              *)        echo "::error::❌ $name: $res"; fail=1 ;;
            esac
          done
          exit $fail

  # ------------------------------------------------------------------ #
  # CDO-141: Validate Helm/manifest làm gate trước deploy.             #
  # lint + template render toàn bộ values overlay của sandbox. Nếu     #
  # chart không render được -> chặn (ArgoCD sẽ không deploy rác).      #
  # ------------------------------------------------------------------ #
  helm:
    name: Helm lint + render (deploy gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: Lint application chart
        run: >-
          helm lint platform/charts/application
          -f platform/gitops/environments/sandbox/values-observability.yaml
          -f platform/gitops/environments/sandbox/values-flagd-sync.yaml
          -f platform/gitops/environments/sandbox/values-external-secrets.yaml
          -f platform/gitops/environments/sandbox/values-image-tags.yaml
      - name: Render application chart
        run: >-
          helm template techx-corp platform/charts/application
          -f platform/gitops/environments/sandbox/values-observability.yaml
          -f platform/gitops/environments/sandbox/values-flagd-sync.yaml
          -f platform/gitops/environments/sandbox/values-external-secrets.yaml
          -f platform/gitops/environments/sandbox/values-image-tags.yaml
          > /tmp/techx-corp-rendered.yaml
      - name: Fail nếu manifest rỗng
        run: |
          set -euo pipefail
          if [ ! -s /tmp/techx-corp-rendered.yaml ]; then
            echo "::error::Chart render ra manifest rỗng — chặn deploy."
            exit 1
          fi
          echo "✅ Chart render OK ($(wc -l < /tmp/techx-corp-rendered.yaml) dòng)"

  # ------------------------------------------------------------------ #
  # MANDATE-10 #1+#2: TRỰC CỔNG cho phần quét ảnh (Trivy).              #
  #                                                                     #
  # Vấn đề: Trivy quét ảnh nằm trong job `build` của app-build.yaml, mà  #
  # job đó tên ĐỘNG theo matrix (`Build email`, `Build currency`...).    #
  # Required status check cần chuỗi CỐ ĐỊNH khai sẵn trong ruleset nên   #
  # không trỏ vào tên động được. Hệ quả: Trivy đỏ chỉ chặn ảnh lên ECR   #
  # (bước quét đứng trước bước push) chứ KHÔNG chặn merge — code mang    #
  # CVE vẫn vào được develop.                                            #
  #                                                                     #
  # Vì sao job này nằm ở ĐÂY chứ không phải trong app-build.yaml:        #
  #   1. app-build.yaml có `paths:` filter -> không chạy trên PR chỉ sửa #
  #      docs/terraform. Đo thật: 5/10 PR gần đây không chạm code        #
  #      service. Required check mà job không chạy = PR treo Expected    #
  #      vĩnh viễn (đúng tai nạn 26/07 với SAST, 4 PR kẹt cứng).         #
  #      platform-ci.yaml KHÔNG có paths filter -> chạy mọi PR.          #
  #   2. Kyverno khoá danh tính ký theo đường dẫn app-build.yaml         #
  #      (subject app-build.yaml@refs/heads/develop). Không đụng file đó #
  #      thì không có rủi ro pod không lên.                              #
  #                                                                     #
  # Vì sao hỏi API thay vì `needs:`: `needs:` chỉ nối job trong CÙNG một #
  # workflow file. Hai file khác nhau nên phải hỏi GitHub "run của       #
  # app-build cho đúng commit này ra sao".                               #
  #                                                                     #
  # Job KHÔNG dựng lại ảnh. TF2 giải bài toán này bằng cách bake lại     #
  # toàn bộ image trên mỗi PR để có cái mà quét; ở đây các nhánh build   #
  # đã chạy sẵn rồi nên chỉ cần đọc kết quả — cùng kết luận, không tốn   #
  # thêm phút runner.                                                    #
  # ------------------------------------------------------------------ #
  image-scan-gate:
    name: Image scan gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Cần để đọc kết quả job của workflow KHÁC (app-build) qua API.
      actions: read
      # Cần để hỏi danh sách file PR đã đổi ở bước 0.
      pull-requests: read
    steps:
      - name: Đọc kết quả quét ảnh của app-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SHA của code THẬT đang xét. Trên PR, github.sha là commit merge tạm
          # do GitHub dựng, không phải commit app-build chạy trên đó.
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # Rỗng khi chạy trên push (không phải PR) — bước 0 tự bỏ qua khi đó.
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # BƯỚC 0 — hỏi TRƯỚC: PR này có chạm đường dẫn nào kích hoạt app-build không?
          #
          # Vì sao phải hỏi trước thay vì cứ chờ: bản đầu của job này lao thẳng vào vòng
          # chờ, nên PR KHÔNG chạm code service (ví dụ chỉ sửa platform-ci.yaml) vẫn ngồi
          # đợi đủ 40 vòng rồi chết vì timeout — đo thật trên PR #435: chạy 614s = 10.2
          # phút rồi bị giết. Check `cancelled` còn tệ hơn đỏ: nó không xanh không đỏ, PR
          # treo lơ lửng. Đây là lỗi logic, không phải do concurrency.
          #
          # Danh sách dưới phải khớp `paths:` trong app-build.yaml. Lệch thì hệ quả nghiêng
          # về phía AN TOÀN: khai thiếu -> job đi vào nhánh chờ và vẫn đọc được kết quả
          # thật; khai thừa -> chờ một run không tồn tại rồi mới cho qua ở bước dưới.
          CHANGED=""
          if [ -n "${PR_NUMBER:-}" ]; then
            CHANGED=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
                        --jq '.[].filename' 2>/dev/null || true)
            if [ -n "$CHANGED" ] && ! printf '%s\n' "$CHANGED" | grep -qE \
                 '^(techx-corp-platform/src/|aiops/|platform/charts/application/values\.yaml$|\.trivyignore$|\.github/workflows/app-build\.yaml$)'; then
              echo "✅ PR không chạm đường dẫn nào kích hoạt app-build — không có ảnh để quét."
              {
                echo "### Cổng quét ảnh — không có ảnh nào cần quét"
                echo ""
                echo "PR này không đụng \`techx-corp-platform/src/\`, \`aiops/\`, \`.trivyignore\`"
                echo "hay chart values, nên app-build không chạy và không image nào được dựng."
                echo "Không có gì để quét là lý do hợp lệ để qua cổng, không phải lỗi."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          # Chờ app-build cho commit này xuất hiện và chạy xong. Nó khởi động cùng
          # lúc với workflow này nên thường chưa có kết quả ngay.
          # Tách hai loại chờ: 8 vòng đầu (2 phút) là hạn CHỜ NÓ XUẤT HIỆN — quá hạn mà
          # vẫn chưa có run nào thì kết luận app-build không được kích hoạt, cho qua luôn
          # thay vì đợi hết 10 phút. Khi đã thấy run rồi thì chờ tiếp tới 40 vòng cho nó
          # chạy xong.
          run_json=""
          for i in $(seq 1 40); do
            run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100" \
                        --jq '[.workflow_runs[] | select(.path == ".github/workflows/app-build.yaml")]
                              | sort_by(.run_number) | last // empty' 2>/dev/null || true)
            if [ -z "$run_json" ]; then
              if [ "$i" -ge 8 ]; then
                echo "Sau 2 phút vẫn không có run app-build -> nó không được kích hoạt."
                break
              fi
              echo "[$i/8] chưa thấy run app-build..."
              sleep 15
              continue
            fi
            status=$(printf '%s' "$run_json" | python3 -c "import json,sys;print(json.load(sys.stdin)['status'])")
            [ "$status" = "completed" ] && break
            echo "[$i/40] app-build đang chạy ($status)..."
            sleep 15
          done

          # Không có run nào = app-build không được kích hoạt vì paths filter.
          # PR này không chạm code service -> không có ảnh nào để quét -> CHO QUA.
          # Đây là nhánh giữ cho gate không treo Expected trên PR sửa docs.
          if [ -z "$run_json" ]; then
            echo "✅ PR không chạm code service (app-build không chạy) — không có ảnh để quét."
            {
              echo "### Cổng quét ảnh — không có ảnh nào cần quét"
              echo ""
              echo "PR này không đụng \`techx-corp-platform/src/\`, \`aiops/\`, \`.trivyignore\`"
              echo "hay chart values, nên workflow app-build không được kích hoạt và không có"
              echo "image nào được dựng. Không có gì để quét là lý do hợp lệ để qua cổng,"
              echo "không phải lỗi."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          run_id=$(printf '%s' "$run_json" | python3 -c "import json,sys;print(json.load(sys.stdin)['id'])")
          run_status=$(printf '%s' "$run_json" | python3 -c "import json,sys;print(json.load(sys.stdin)['status'])")
          echo "app-build run: $run_id (status=$run_status)"

          if [ "$run_status" != "completed" ]; then
            echo "::error::app-build (run $run_id) chưa xong sau 10 phút. Chạy lại job này khi nó kết thúc."
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
            --jq '.jobs[] | "\(.conclusion // "running")\t\(.name)"' > /tmp/jobs.tsv
          echo "--- job của run $run_id ---"; cat /tmp/jobs.tsv

          fail=0
          rows=""

          # Hai nhánh detect KHÔNG được hỏng: chúng quyết định service nào cần dựng.
          # Detect hỏng mà cho qua thì gate mù — không biết đáng lẽ phải quét những gì.
          while IFS=$'\t' read -r res name; do
            case "$name" in
              "Detect changed services"|"Detect aiops changes")
                case "$res" in
                  success|skipped) echo "✅ $name: $res" ;;
                  *) echo "::error::❌ $name: $res — không xác định được cần quét gì."; fail=1 ;;
                esac
                rows="${rows}| ${name} | \`${res}\` |"$'\n'
                ;;
            esac
          done < /tmp/jobs.tsv

          # Nhánh dựng+quét. Khớp cả hai dạng tên: khi matrix RỖNG thì API trả tên
          # chưa nội suy (`Build ${{ matrix.service }}`), khi có service thì trả tên
          # thật (`Build email`). Bỏ qua "Build aiops-detector" -> vẫn khớp "Build ".
          while IFS=$'\t' read -r res name; do
            case "$name" in
              "Build "*)
                case "$res" in
                  success) echo "✅ $name: quét sạch, không CVE HIGH/CRITICAL" ;;
                  skipped) echo "⏭️  $name: không có ảnh nào cần dựng" ;;
                  *) echo "::error::❌ $name: $res — Trivy thấy CVE HIGH/CRITICAL, hoặc build hỏng."; fail=1 ;;
                esac
                rows="${rows}| ${name} | \`${res}\` |"$'\n'
                ;;
            esac
          done < /tmp/jobs.tsv

          {
            echo "### Cổng quét ảnh"
            echo ""
            echo "Đọc từ [run ${run_id}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}) của \`app-build.yaml\`."
            echo ""
            echo "| Nhánh | Kết quả |"
            echo "|---|---|"
            printf '%s' "$rows"
            echo ""
            echo "> \`skipped\` = PR không đụng service đó nên không có ảnh để quét — hợp lệ."
            echo "> \`failure\` = có ảnh và Trivy thấy CVE HIGH/CRITICAL — chặn."
            echo ""
            echo "> Trivy chặn ở HAI tầng: bước quét đứng TRƯỚC bước push nên ảnh bẩn không"
            echo "> lên được ECR; job này đưa cùng kết quả đó lên tầng merge."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$fail" -ne 0 ]; then
            echo "::error::Cổng quét ảnh KHÔNG pass — xem run $run_id để biết CVE nào."
            exit 1
          fi
          echo "✅ Cổng quét ảnh pass."
