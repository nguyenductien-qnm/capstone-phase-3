name: Trace Image Provenance

# Manual evidence workflow for Mandate 10. It starts from a running pod and a
# claimed image digest, then reconstructs the supply-chain trail:
# pod -> runtime digest -> SLSA provenance -> signature -> SBOM -> build run -> PR reviewer.

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Expected image digest, e.g. sha256:...; empty = derive from running pod"
        required: false
        type: string
      namespace:
        description: "Kubernetes namespace"
        required: true
        default: "techx-tf1"
        type: string
      pod:
        description: "Running pod name"
        required: true
        type: string
      container:
        description: "Container name; empty = first container"
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read
  attestations: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'ecommerce-dev-eks' }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY || '804372444787.dkr.ecr.us-east-1.amazonaws.com' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'ecommerce-dev-techx-corp' }}
  BUILD_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/app-build.yaml@refs/heads/develop
  OIDC_ISSUER: https://token.actions.githubusercontent.com
  APP_BUILD_WORKFLOW: app-build.yaml

jobs:
  trace:
    name: Trace pod image provenance
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.TF_AWS_ROLE_ARN }}
          allowed-account-ids: "804372444787"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-trace-provenance-${{ github.actor }}-${{ github.run_id }}

      - name: Install kubectl
        uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with:
          version: "v1.30.0"

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Trace image provenance
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ inputs.digest }}
          NAMESPACE: ${{ inputs.namespace }}
          POD: ${{ inputs.pod }}
          CONTAINER: ${{ inputs.container }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          pass_line() {
            printf 'PASS %-24s %s\n' "$1" "$2"
          }

          echo "## Trace Image Provenance" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Link | Evidence |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pod | \`${NAMESPACE}/${POD}\` |" >> "$GITHUB_STEP_SUMMARY"

          echo "== Kubernetes runtime digest =="
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
          kubectl cluster-info
          kubectl get pod -n "$NAMESPACE" "$POD" -o json > pod.json

          if [ -z "${CONTAINER:-}" ]; then
            CONTAINER="$(jq -r '.status.containerStatuses[0].name // empty' pod.json)"
          fi
          [ -n "$CONTAINER" ] || fail "could not resolve container name"

          SPEC_IMAGE="$(jq -r --arg c "$CONTAINER" '.spec.containers[] | select(.name == $c) | .image // empty' pod.json)"
          IMAGE_ID="$(jq -r --arg c "$CONTAINER" '.status.containerStatuses[] | select(.name == $c) | .imageID // empty' pod.json)"
          [ -n "$IMAGE_ID" ] || fail "container $CONTAINER not found or has no runtime imageID"

          RUNTIME_DIGEST="$(grep -oE 'sha256:[a-fA-F0-9]{64}' <<<"$IMAGE_ID" | head -n 1 || true)"
          [ -n "$RUNTIME_DIGEST" ] || fail "could not extract sha256 digest from runtime imageID=$IMAGE_ID"

          if [ -z "${DIGEST:-}" ]; then
            DIGEST="$RUNTIME_DIGEST"
            pass_line "runtime digest" "$NAMESPACE/$POD container=$CONTAINER -> $DIGEST (derived)"
          elif [[ "$DIGEST" =~ ^sha256:[a-fA-F0-9]{64}$ ]]; then
            if [ "${DIGEST,,}" != "${RUNTIME_DIGEST,,}" ]; then
              fail "pod runtime digest does not match input digest. input=$DIGEST runtime=$RUNTIME_DIGEST imageID=$IMAGE_ID"
            fi
            pass_line "runtime digest" "$NAMESPACE/$POD container=$CONTAINER -> $DIGEST (matched input)"
          else
            fail "digest must look like sha256:<64 hex chars> when provided"
          fi

          IMAGE_REF="${ECR_REGISTRY}/${ECR_REPOSITORY}@${DIGEST}"
          OCI_SUBJECT="oci://${IMAGE_REF}"

          echo "| Trace digest | \`${DIGEST}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image ref | \`${IMAGE_REF}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runtime container | \`${CONTAINER}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Spec image | \`${SPEC_IMAGE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runtime imageID | \`${IMAGE_ID}\` |" >> "$GITHUB_STEP_SUMMARY"

          echo "== Registry auth =="
          aws ecr get-login-password --region "$AWS_REGION" \
            | cosign login --username AWS --password-stdin "$ECR_REGISTRY"
          pass_line "registry auth" "$ECR_REGISTRY"

          echo "== SLSA provenance =="
          gh attestation verify "$OCI_SUBJECT" -R "$GITHUB_REPOSITORY" --format json > slsa.json
          pass_line "slsa provenance" "$OCI_SUBJECT"
          echo "| SLSA provenance | PASS via \`gh attestation verify\` |" >> "$GITHUB_STEP_SUMMARY"

          COMMIT="$(
            jq -r '
              .. | strings
              | select(test("^[0-9a-fA-F]{40}$"))
            ' slsa.json | head -n 1
          )"

          if [ -z "$COMMIT" ]; then
            SHORT_SHA="$(sed -nE 's/.*-([0-9a-fA-F]{7,12})(@sha256:.*)?$/\1/p' <<<"$SPEC_IMAGE" | head -n 1)"
            if [ -n "$SHORT_SHA" ]; then
              COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHORT_SHA}" --jq '.sha')"
            fi
          fi
          [ -n "$COMMIT" ] || fail "could not extract source commit from SLSA attestation or image tag"
          pass_line "source commit" "$COMMIT"
          echo "| Source commit | [\`${COMMIT}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${COMMIT}) |" >> "$GITHUB_STEP_SUMMARY"

          echo "== Cosign signature =="
          cosign verify \
            --certificate-identity "$BUILD_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$IMAGE_REF" > cosign-signature.json
          pass_line "cosign signature" "$BUILD_IDENTITY"
          echo "| Signer identity | \`${BUILD_IDENTITY}\` |" >> "$GITHUB_STEP_SUMMARY"

          echo "== SBOM attestation =="
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity "$BUILD_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$IMAGE_REF" > sbom-attestation.json
          pass_line "sbom attestation" "type=spdxjson"
          echo "| SBOM | PASS \`spdxjson\` attestation verified |" >> "$GITHUB_STEP_SUMMARY"

          echo "== GitHub Actions build run =="
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --commit "$COMMIT" \
            --workflow "$APP_BUILD_WORKFLOW" \
            --limit 20 \
            --json databaseId,status,conclusion,createdAt,url,displayTitle,headSha > runs.json

          RUN_JSON="$(jq -c '[.[] | select(.conclusion == "success")][0] // empty' runs.json)"
          [ -n "$RUN_JSON" ] || fail "no successful $APP_BUILD_WORKFLOW run found for commit $COMMIT"
          RUN_ID="$(jq -r '.databaseId' <<<"$RUN_JSON")"
          RUN_URL="$(jq -r '.url' <<<"$RUN_JSON")"
          pass_line "app-build run" "run=$RUN_ID conclusion=success"
          echo "| Build/scan/sign run | [run ${RUN_ID}](${RUN_URL}) conclusion=success |" >> "$GITHUB_STEP_SUMMARY"

          gh run view "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json jobs > run-jobs.json

          PASSED_JOBS="$(
            jq -r '
              [.jobs[]? | select(.conclusion == "success") | .name]
              | unique
              | join("<br>")
            ' run-jobs.json
          )"
          [ -n "$PASSED_JOBS" ] || fail "build run $RUN_ID is successful, but no successful jobs were returned by GitHub API"
          pass_line "passed jobs" "$(jq -r '[.jobs[]? | select(.conclusion == "success") | .name] | unique | join(", ")' run-jobs.json)"
          echo "| Scan/build/sign jobs passed | ${PASSED_JOBS} |" >> "$GITHUB_STEP_SUMMARY"

          echo "== Pull request and reviewer =="
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${COMMIT}/pulls" > prs.json

          PR_JSON="$(jq -c '.[0] // empty' prs.json)"
          [ -n "$PR_JSON" ] || fail "no merged PR found for commit $COMMIT"
          PR_NUMBER="$(jq -r '.number' <<<"$PR_JSON")"
          PR_URL="$(jq -r '.html_url' <<<"$PR_JSON")"
          PR_TITLE="$(jq -r '.title' <<<"$PR_JSON")"

          gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json reviews,mergedAt,url,title,number > pr-view.json

          REVIEWERS="$(jq -r '[.reviews[]? | select(.state == "APPROVED") | .author.login] | unique | join(", ")' pr-view.json)"
          [ -n "$REVIEWERS" ] || fail "PR #$PR_NUMBER found, but no APPROVED review in API response"
          pass_line "merged PR" "#$PR_NUMBER approvedBy=$REVIEWERS"
          echo "| Pull request | [#${PR_NUMBER} ${PR_TITLE}](${PR_URL}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Approved by | \`${REVIEWERS}\` |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "PASS: pod runtime digest traced to SLSA provenance, cosign signature, SBOM, successful app-build run, and approved PR." >> "$GITHUB_STEP_SUMMARY"


