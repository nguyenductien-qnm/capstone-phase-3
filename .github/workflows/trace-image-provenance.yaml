name: "9 · Ops — Truy vết nguồn gốc ảnh"

# Manual evidence workflow for Mandate 10. It starts from a running pod and a
# claimed image digest, then reconstructs the supply-chain trail:
# pod -> runtime digest -> SLSA provenance -> signature -> SBOM -> promote attest -> build run -> PR reviewer.

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Expected image digest, e.g. sha256:...; empty = derive from running pod"
        required: false
        type: string
      namespace:
        description: "Kubernetes namespace"
        required: true
        default: "techx-tf1"
        type: string
      pod:
        description: "Running pod name"
        required: true
        type: string
      container:
        description: "Container name; empty = first container"
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read
  attestations: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'ecommerce-dev-eks' }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY || '804372444787.dkr.ecr.us-east-1.amazonaws.com' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'ecommerce-dev-techx-corp' }}
  ATTEST_REPOSITORY: ${{ vars.ECR_ATTEST_REPOSITORY || 'ecommerce-dev-techx-corp-attest' }}
  BUILD_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/app-build.yaml@refs/heads/develop
  ATTEST_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/app-attest.yaml@refs/heads/develop
  OIDC_ISSUER: https://token.actions.githubusercontent.com
  PROMOTED_DEVELOP_TYPE: https://github.com/nguyenductien-qnm/capstone-phase-3/promoted-develop/v1
  APP_BUILD_WORKFLOW: app-build.yaml

jobs:
  trace:
    name: Trace pod image provenance
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.TF_AWS_ROLE_ARN }}
          allowed-account-ids: "804372444787"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-trace-provenance-${{ github.actor }}-${{ github.run_id }}

      - name: Install kubectl
        uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with:
          version: "v1.30.0"

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Trace image provenance
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ inputs.digest }}
          NAMESPACE: ${{ inputs.namespace }}
          POD: ${{ inputs.pod }}
          CONTAINER: ${{ inputs.container }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          pass_line() {
            printf 'PASS %-24s %s\n' "$1" "$2"
          }

          echo "## Trace Image Provenance" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Link | Evidence |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pod | \`${NAMESPACE}/${POD}\` |" >> "$GITHUB_STEP_SUMMARY"

          echo "== Kubernetes runtime digest =="
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
          kubectl cluster-info
          kubectl get pod -n "$NAMESPACE" "$POD" -o json > pod.json

          if [ -z "${CONTAINER:-}" ]; then
            CONTAINER="$(jq -r '.status.containerStatuses[0].name // empty' pod.json)"
          fi
          [ -n "$CONTAINER" ] || fail "could not resolve container name"

          SPEC_IMAGE="$(jq -r --arg c "$CONTAINER" '.spec.containers[] | select(.name == $c) | .image // empty' pod.json)"
          IMAGE_ID="$(jq -r --arg c "$CONTAINER" '.status.containerStatuses[] | select(.name == $c) | .imageID // empty' pod.json)"
          [ -n "$IMAGE_ID" ] || fail "container $CONTAINER not found or has no runtime imageID"

          RUNTIME_DIGEST="$(grep -oE 'sha256:[a-fA-F0-9]{64}' <<<"$IMAGE_ID" | head -n 1 || true)"
          [ -n "$RUNTIME_DIGEST" ] || fail "could not extract sha256 digest from runtime imageID=$IMAGE_ID"

          if [ -z "${DIGEST:-}" ]; then
            DIGEST="$RUNTIME_DIGEST"
            pass_line "runtime digest" "$NAMESPACE/$POD container=$CONTAINER -> $DIGEST (derived)"
          elif [[ "$DIGEST" =~ ^sha256:[a-fA-F0-9]{64}$ ]]; then
            if [ "${DIGEST,,}" != "${RUNTIME_DIGEST,,}" ]; then
              fail "pod runtime digest does not match input digest. input=$DIGEST runtime=$RUNTIME_DIGEST imageID=$IMAGE_ID"
            fi
            pass_line "runtime digest" "$NAMESPACE/$POD container=$CONTAINER -> $DIGEST (matched input)"
          else
            fail "digest must look like sha256:<64 hex chars> when provided"
          fi

          IMAGE_REF="${ECR_REGISTRY}/${ECR_REPOSITORY}@${DIGEST}"
          OCI_SUBJECT="oci://${IMAGE_REF}"

          echo "| Trace digest | \`${DIGEST}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image ref | \`${IMAGE_REF}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runtime container | \`${CONTAINER}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Spec image | \`${SPEC_IMAGE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runtime imageID | \`${IMAGE_ID}\` |" >> "$GITHUB_STEP_SUMMARY"

          echo "== Registry auth =="
          aws ecr get-login-password --region "$AWS_REGION" \
            | cosign login --username AWS --password-stdin "$ECR_REGISTRY"
          pass_line "registry auth" "$ECR_REGISTRY"

          echo "== SLSA provenance =="
          gh attestation verify "$OCI_SUBJECT" -R "$GITHUB_REPOSITORY" --format json > slsa.json
          pass_line "slsa provenance" "$OCI_SUBJECT"
          echo "| SLSA provenance | PASS via \`gh attestation verify\` |" >> "$GITHUB_STEP_SUMMARY"

          COMMIT="$(
            jq -r '
              .. | strings
              | select(test("^[0-9a-fA-F]{40}$"))
            ' slsa.json | head -n 1
          )"

          if [ -z "$COMMIT" ]; then
            SHORT_SHA="$(sed -nE 's/.*-([0-9a-fA-F]{7,12})(@sha256:.*)?$/\1/p' <<<"$SPEC_IMAGE" | head -n 1)"
            if [ -n "$SHORT_SHA" ]; then
              COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHORT_SHA}" --jq '.sha')"
            fi
          fi
          [ -n "$COMMIT" ] || fail "could not extract source commit from SLSA attestation or image tag"
          pass_line "source commit" "$COMMIT"
          echo "| Source commit | [\`${COMMIT}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${COMMIT}) |" >> "$GITHUB_STEP_SUMMARY"

          echo "== Cosign signature =="
          cosign verify \
            --certificate-identity "$BUILD_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$IMAGE_REF" > cosign-signature.json
          pass_line "cosign signature" "$BUILD_IDENTITY"
          echo "| Signer identity | \`${BUILD_IDENTITY}\` |" >> "$GITHUB_STEP_SUMMARY"

          echo "== SBOM attestation =="
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity "$BUILD_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$IMAGE_REF" > sbom-attestation.json
          pass_line "sbom attestation" "type=spdxjson"
          echo "| SBOM | PASS \`spdxjson\` attestation verified |" >> "$GITHUB_STEP_SUMMARY"

          echo "== Promoted-develop attestation =="
          ATTEST_REPO="${ECR_REGISTRY}/${ATTEST_REPOSITORY}"
          COSIGN_REPOSITORY="$ATTEST_REPO" cosign verify-attestation \
            --type "$PROMOTED_DEVELOP_TYPE" \
            --certificate-identity "$ATTEST_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$IMAGE_REF" > promoted-develop-attestation.json

          PROMOTE_JSON="$(
            jq -ecs '
              [.[] | .payload | @base64d | fromjson | .predicate]
              | map(select(.environment == "develop"))
              | .[0] // empty
            ' promoted-develop-attestation.json
          )"
          [ -n "$PROMOTE_JSON" ] || fail "promoted-develop attestation exists but no develop predicate was found"

          PROMOTED_SERVICE="$(jq -r '.service // "unknown"' <<<"$PROMOTE_JSON")"
          PROMOTED_TAG="$(jq -r '.tag // "unknown"' <<<"$PROMOTE_JSON")"
          PROMOTED_DIGEST="$(jq -r '.digest // "unknown"' <<<"$PROMOTE_JSON")"
          PROMOTED_BY="$(jq -r '.attestedBy // "unknown"' <<<"$PROMOTE_JSON")"
          if [ "$PROMOTED_DIGEST" != "unknown" ] && [ "${PROMOTED_DIGEST,,}" != "${DIGEST,,}" ]; then
            fail "promoted-develop digest mismatch. attestation=$PROMOTED_DIGEST runtime=$DIGEST"
          fi
          pass_line "promote attestation" "service=$PROMOTED_SERVICE tag=$PROMOTED_TAG"
          echo "| Promoted from develop | PASS service=\`${PROMOTED_SERVICE}\`, tag=\`${PROMOTED_TAG}\`, attestedBy=${PROMOTED_BY} |" >> "$GITHUB_STEP_SUMMARY"
          echo "== GitHub Actions build run =="
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --commit "$COMMIT" \
            --workflow "$APP_BUILD_WORKFLOW" \
            --limit 20 \
            --json databaseId,status,conclusion,createdAt,url,displayTitle,event,headSha > runs.json

          RUN_JSON="$(jq -c '[.[] | select(.conclusion == "success")][0] // empty' runs.json)"
          [ -n "$RUN_JSON" ] || fail "no successful $APP_BUILD_WORKFLOW run found for commit $COMMIT"
          RUN_ID="$(jq -r '.databaseId' <<<"$RUN_JSON")"
          RUN_URL="$(jq -r '.url' <<<"$RUN_JSON")"
          RUN_EVENT="$(jq -r '.event // "unknown"' <<<"$RUN_JSON")"
          RUN_TITLE="$(jq -r '.displayTitle // "unknown"' <<<"$RUN_JSON")"
          RUN_HEAD_SHA="$(jq -r '.headSha // "unknown"' <<<"$RUN_JSON")"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > run-detail.json
          RUN_WORKFLOW_NAME="$(jq -r '.name // "unknown"' run-detail.json)"
          RUN_WORKFLOW_PATH="$(jq -r '.path // "unknown"' run-detail.json)"
          RUN_NUMBER="$(jq -r '.run_number // "unknown"' run-detail.json)"
          RUN_ACTOR="$(jq -r '.actor.login // "unknown"' run-detail.json)"
          RUN_TRIGGERING_ACTOR="$(jq -r '.triggering_actor.login // "unknown"' run-detail.json)"
          pass_line "app-build run" "run=$RUN_ID conclusion=success"
          echo "| Build/scan/sign run | [run ${RUN_ID}](${RUN_URL}) conclusion=success |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build workflow/action | [${RUN_WORKFLOW_NAME} #${RUN_NUMBER}](${RUN_URL}) (\`${RUN_WORKFLOW_PATH}\`) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build run trigger | \`${RUN_EVENT}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build run actor | \`${RUN_ACTOR}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build run triggering actor | \`${RUN_TRIGGERING_ACTOR}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build run title | \`${RUN_TITLE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build run head SHA | \`${RUN_HEAD_SHA}\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$RUN_EVENT" = "workflow_dispatch" ]; then
            pass_line "run trigger" "workflow_dispatch (manual run by $RUN_TRIGGERING_ACTOR in $RUN_WORKFLOW_PATH)"
            echo "| Build run note | Manual workflow_dispatch run. This can rebuild the full repository snapshot at the source commit; it does not mean the traced PR changed every service. |" >> "$GITHUB_STEP_SUMMARY"
          else
            pass_line "run trigger" "$RUN_EVENT"
          fi

          gh run view "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json jobs > run-jobs.json

          TRACE_SERVICE="$PROMOTED_SERVICE"
          if [ -z "$TRACE_SERVICE" ] || [ "$TRACE_SERVICE" = "unknown" ]; then
            TRACE_SERVICE="$CONTAINER"
          fi
          # MULTI-ARCH: app-build dựng MỖI service thành NHIỀU job — một job cho mỗi
          # kiến trúc, tên dạng "Build <svc> (amd64)" / "Build <svc> (arm64)" — rồi một
          # job "Merge <svc>" gộp chúng thành manifest list và ký INDEX digest.
          #
          # So khớp tên chính xác như trước sẽ KHÔNG tìm thấy job nào (tên đã đổi), và
          # nếu chỉ nới thành so-khớp-tiền-tố rồi lấy phần tử [0] thì gate chỉ soi được
          # MỘT kiến trúc ngẫu nhiên — nửa còn lại đỏ vẫn lọt. Nên: bắt buộc phải có
          # >= 2 job build, TẤT CẢ phải success, và job Merge cũng phải success.
          SERVICE_BUILD_JOB="Build ${TRACE_SERVICE}"
          BUILD_JOBS_JSON="$(
            jq -c --arg prefix "$SERVICE_BUILD_JOB (" '
              [.jobs[]? | select(.name | startswith($prefix)) | {name, conclusion}]
            ' run-jobs.json
          )"
          BUILD_JOBS_COUNT="$(jq 'length' <<<"$BUILD_JOBS_JSON")"
          [ "$BUILD_JOBS_COUNT" -ge 2 ] || fail "build run $RUN_ID có $BUILD_JOBS_COUNT job '$SERVICE_BUILD_JOB (<arch>)', cần >= 2 (amd64 + arm64)"
          BUILD_JOBS_BAD="$(jq -r '[.[] | select(.conclusion != "success") | "\(.name)=\(.conclusion)"] | join(", ")' <<<"$BUILD_JOBS_JSON")"
          [ -z "$BUILD_JOBS_BAD" ] || fail "job build không xanh: $BUILD_JOBS_BAD"
          BUILD_JOBS_LIST="$(jq -r '[.[].name] | join(", ")' <<<"$BUILD_JOBS_JSON")"

          SERVICE_MERGE_JOB="Merge ${TRACE_SERVICE}"
          MERGE_JOB_CONCLUSION="$(
            jq -r --arg name "$SERVICE_MERGE_JOB" '
              [.jobs[]? | select(.name == $name)][0].conclusion // empty
            ' run-jobs.json
          )"
          [ -n "$MERGE_JOB_CONCLUSION" ] || fail "build run $RUN_ID thiếu job gộp manifest list: $SERVICE_MERGE_JOB"
          [ "$MERGE_JOB_CONCLUSION" = "success" ] || fail "$SERVICE_MERGE_JOB conclusion=$MERGE_JOB_CONCLUSION"

          pass_line "service build jobs" "$BUILD_JOBS_COUNT job, tất cả success: $BUILD_JOBS_LIST"
          pass_line "service merge job" "$SERVICE_MERGE_JOB conclusion=success"
          echo "| Traced service build jobs | \`${BUILD_JOBS_LIST}\` (${BUILD_JOBS_COUNT} kiến trúc, đều success) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Traced service merge/sign job | \`${SERVICE_MERGE_JOB}\` conclusion=success |" >> "$GITHUB_STEP_SUMMARY"

          echo "== Pull request and reviewer =="
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${COMMIT}/pulls" > prs.json

          PR_JSON="$(jq -c '.[0] // empty' prs.json)"
          [ -n "$PR_JSON" ] || fail "no merged PR found for commit $COMMIT"
          PR_NUMBER="$(jq -r '.number' <<<"$PR_JSON")"
          PR_URL="$(jq -r '.html_url' <<<"$PR_JSON")"
          PR_TITLE="$(jq -r '.title' <<<"$PR_JSON")"

          gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json author,reviews,mergedAt,url,title,number > pr-view.json

          PR_AUTHOR="$(jq -r '.author.login // "unknown"' pr-view.json)"
          REVIEWERS="$(
            jq -r --arg author "$PR_AUTHOR" '
              [.reviews[]? | select(.state != "COMMENTED" and .state != "PENDING" and .state != "DISMISSED")]
              | sort_by(.submittedAt // "")
              | group_by(.author.login)
              | map(last)
              | map(select(.state == "APPROVED" and .author.login != $author))
              | map(.author.login)
              | unique
              | join(", ")
            ' pr-view.json
          )"
          [ -n "$REVIEWERS" ] || fail "PR #$PR_NUMBER found, but no latest non-author APPROVED review in API response"
          pass_line "source PR" "#$PR_NUMBER approvedBy=$REVIEWERS"
          echo "| Source merge commit PR | [#${PR_NUMBER} ${PR_TITLE}](${PR_URL}) |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$RUN_EVENT" = "workflow_dispatch" ]; then
            echo "| PR trace note | Changed files may not belong to the traced service when app-build was run as a manual full rebuild. The PR is the source merge commit for the repository snapshot used to build this image. |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "| Approved by | \`${REVIEWERS}\` |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "PASS: pod runtime digest traced to SLSA provenance, cosign signature, SBOM, promoted-develop attestation, successful app-build run, and approved PR." >> "$GITHUB_STEP_SUMMARY"


