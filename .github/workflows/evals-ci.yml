name: Evals CI

on:
  push:
    paths:
      - 'docs/ai/evals/**'
      - 'requirements-copilot.txt'
  pull_request:
    paths:
      - 'docs/ai/evals/**'
      - 'requirements-copilot.txt'

permissions:
  contents: read

jobs:
  test-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-copilot.txt
          pip install pytest
      - name: Run eval tests
        run: |
          pytest docs/ai/evals/test_correlate.py -q
