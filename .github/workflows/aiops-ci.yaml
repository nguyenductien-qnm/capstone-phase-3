name: AIOps CI

on:
  pull_request:
    paths:
      - "aiops/**"
      - ".github/workflows/aiops-ci.yaml"
  push:
    branches: [main, develop]
    paths:
      - "aiops/**"
      - ".github/workflows/aiops-ci.yaml"

permissions:
  contents: read

concurrency:
  group: aiops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [log_clustering, detector, remediation]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aiops/${{ matrix.module }}/requirements.txt
      - run: pip install -r aiops/${{ matrix.module }}/requirements.txt pytest

      # promtool parse duoc PromQL ma khong can Prometheus dang chay. Chi can cho
      # `detector` (module duy nhat co rules.yaml).
      #
      # Ghim 3.8.1 CO Y: day dung la ban ma rules.yaml ghi la da verify syntax truoc
      # do, nen CI kiem bang chinh parser do chu khong bang mot ban moi hon co the
      # nhan/tu choi khac di. Checksum lay tu sha256sums.txt cua chinh release.
      - name: Cai promtool
        if: matrix.module == 'detector'
        run: |
          set -euxo pipefail
          VERSION=3.8.1
          SHA256=a09972ced892cd298e353eb9559f1a90f499da3fb4ff0845be352fc138780ee7
          curl -sSfL --retry 3 -o prom.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${VERSION}/prometheus-${VERSION}.linux-amd64.tar.gz"
          echo "${SHA256}  prom.tar.gz" | sha256sum -c -
          tar -xzf prom.tar.gz
          sudo install -m 0755 "prometheus-${VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
          promtool --version

      # Chay TRUOC pytest: rules.yaml hong thi bao ngay bang thong bao doc duoc, thay vi
      # de test_validate_rules.py bao gian tiep.
      #
      # KHONG dat --allow-missing-promtool o day. Neu buoc cai tren hong, buoc nay phai
      # DO chu khong duoc am tham bo qua check PromQL — CI xanh nho bo qua kiem tra dung
      # la lop loi ma ca thay doi nay sinh ra de chan.
      - name: Kiem rules.yaml (schema + cu phap PromQL)
        if: matrix.module == 'detector'
        run: python validate_rules.py
        working-directory: aiops/detector

      - run: pytest -q
        working-directory: aiops/${{ matrix.module }}
