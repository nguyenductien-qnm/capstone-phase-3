apiVersion: v1
kind: Pod
metadata:
  name: psql-drill-loss
  namespace: techx-tf1
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
  containers:
    - name: runner
      image: postgres:15-alpine
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      env:
        - name: PGURL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: catalog-db-conn
      command:
        - sh
        - -c
        - |
          psql "$PGURL" -c "DROP SCHEMA IF EXISTS drill_m20 CASCADE;"
          echo "DATA_LOSS_EVENT_COMPLETED"
