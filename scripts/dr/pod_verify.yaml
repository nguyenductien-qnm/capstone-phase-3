apiVersion: v1
kind: Pod
metadata:
  name: psql-drill-verify
  namespace: techx-develop
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
  containers:
    - name: runner
      image: postgres:15-alpine
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      command:
        - sh
        - -c
        - |
          export PGPASSWORD='fWX2.+v%S6VY)vrG+Ol.rwR*5EWpd+XD'
          psql -h ecommerce-develop-dev-postgres-drill-temp.cgduc4gcisdx.us-east-1.rds.amazonaws.com -U db_admin -d ecommerce_db -c "SELECT count(*), md5(string_agg(id::text || order_id || amount::text || status, ',' ORDER BY id)) FROM drill_m20.orders_audit;"
