# Sandbox observability overrides. The dedicated node is provisioned by the
# EKS module as workload-tier=observability with a NoSchedule taint.

observabilityStorage:
  enabled: true
  parameters:
    type: gp3
    encrypted: "true"
    additional-tags: "Backup=true,Component=observability"


opentelemetry-collector:
  # Danh sách này REPLACE toàn bộ tolerations của chart (Helm không merge list),
  # nên phải liệt kê đủ cả 2 taint DaemonSet cần tolerate, không chỉ thêm mới.
  # techx.io/capacity=spot: thiếu cái này thì node spot của Karpenter (ad,
  # product-reviews) không có collector cục bộ -> otel-collector Service dùng
  # internalTrafficPolicy: Local nên mất hẳn endpoint (không phải chậm), OTLP
  # export từ pod trên node đó luôn fail.
  tolerations:
    - key: dedicated
      operator: Equal
      value: observability
      effect: NoSchedule
    - key: techx.io/capacity
      operator: Equal
      value: spot
      effect: NoSchedule
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  config:
    service:
      pipelines:
        # Keep all real backends and spanmetrics; remove only the duplicate
        # stdout debug exporter in the canonical sandbox runtime.
        traces:
          exporters: [otlp/jaeger, spanmetrics]
        metrics:
          exporters: [otlphttp/prometheus]
        logs:
          exporters: [opensearch]

telemetryRetention:
  # 2026-07-26: disk lên 91% (flood-stage, index otel-logs bị block ghi), chặn
  # collector's opensearch exporter -> currency's blocking OTLP export nghẽn theo
  # -> checkout DeadlineExceeded/500 (xác nhận qua log thật). Owner approved bật
  # gate này để giải phóng đĩa. 7d (không phải 3d mặc định): giữ log gần nhất lâu
  # hơn, đủ giải phóng ~1.6GB (otel-logs-07-16/17/18, đưa disk usage ~91% -> ~73%).
  # Không có backup/snapshot cho index bị xóa (đã xác nhận _snapshot rỗng) -- mất
  # là mất luôn, chấp nhận đánh đổi vì chưa có backup khả dụng.
  enabled: true
  minIndexAge: 7d

jaeger:
  jaeger:
    nodeSelector:
      workload-tier: observability
    tolerations:
      - key: dedicated
        operator: Equal
        value: observability
        effect: NoSchedule
    resources:
      requests:
        cpu: 100m
        memory: 640Mi
      limits:
        cpu: 500m
        memory: 1Gi

prometheus:
  kube-state-metrics:
    nodeSelector:
      workload-tier: observability
    tolerations:
      - key: dedicated
        operator: Equal
        value: observability
        effect: NoSchedule
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
  server:
    nodeSelector:
      workload-tier: observability
    tolerations:
      - key: dedicated
        operator: Equal
        value: observability
        effect: NoSchedule
    persistentVolume:
      enabled: true
      storageClass: gp3-observability
      accessModes:
        - ReadWriteOnce
      size: 20Gi
    resources:
      requests:
        cpu: 250m
        memory: 768Mi
      limits:
        cpu: 1000m
        memory: 1536Mi

grafana:
  nodeSelector:
    workload-tier: observability
  tolerations:
    - key: dedicated
      operator: Equal
      value: observability
      effect: NoSchedule
  podLabels:
    egress-internet: "true"
  plugins:
    - grafana-opensearch-datasource
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 768Mi
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        cpu: 50m
        memory: 128Mi

opensearch:
  enabled: true
  nodeSelector:
    workload-tier: observability
  tolerations:
    - key: dedicated
      operator: Equal
      value: observability
      effect: NoSchedule
  persistence:
    enabled: true
    storageClass: gp3-observability
    size: 10Gi
    # Tắt initContainer fsgroup-volume (busybox root chown). Dùng podSecurityContext.fsGroup:1000
    # (chart default) — kubelet tự chown PVC trên EBS gp3. Bỏ container root =>
    # hết vi phạm priv-esc/caps/non-root/floating-tag của fsgroup-volume.
    enableInitChown: false
  # Resources cho init còn lại (configfile) => thỏa require-cpu-memory.
  initResources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi

components:
  load-generator:
    schedulingRules:
      nodeSelector:
        workload-tier: observability
      tolerations:
        - key: dedicated
          operator: Equal
          value: observability
          effect: NoSchedule
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 750m
        memory: 512Mi
