# Mandate-19: port sizing + HPA đã đo trên develop sang PROD (techx-tf1).
# Bằng chứng AFTER: docs/mandate-19/loadtest/EVIDENCE.md E7/E8 + ADR throughput-ceiling.
# Develop đo trên node t3.large cùng cỡ prod (parity dựng ở PR #237) nên số mang sang được.
# BẮT BUỘC đi cùng image frontend-proxy có YC4 load-shed (>= tag a0a954f — prod đã nhận
# qua PR promote 22/07): ngưỡng shed browse 80rps/homepage 100rps được tune theo sizing
# này; có shed mà không có sizing (hoặc ngược lại) là lệch điểm gãy.
default:
  # Karpenter Phase 1: ưu tiên khác host nhưng không ép tạo một node cho mỗi replica.
  # Zone spread là hard requirement để critical replicas thực sự chạy trên >=2 AZ.
  topologySpreadWhenUnsatisfiable: ScheduleAnyway
  topologySpreadZoneWhenUnsatisfiable: DoNotSchedule
  topologySpreadZoneMinDomains: 2
  # Mandate-13 Phương án B, đơn giản hoá (27-07-2026): an toàn mặc định = on-demand
  # cho MỌI component, đặt ở đây thay vì lặp lại nodeSelector ở từng service (cách
  # cũ, đã bỏ — xem git history nếu cần đối chiếu). Component nào có
  # `schedulingRules.nodeSelector` riêng (11 service Nhóm B bên dưới) sẽ override
  # đúng theo cơ chế `_objects.tpl` (component-level luôn thắng default). Component
  # KHÔNG khai báo gì — kể cả service mới thêm sau này mà quên cấu hình — sẽ tự
  # động rơi vào nhánh an toàn này thay vì lộ ra spot.
  # 27-07-2026 (dựa trên đo trực tiếp trên cluster thật, không dựa ADR giấy):
  # accounting/fraud-detection (Kafka consumer async, ngoài critical path, tự
  # nhận "chấp nhận gián đoạn ngắn") đã được đưa vào NodePool `spot` riêng bên
  # dưới — xem comment đầu block `components:`.
  # 27-07-2026 (re-audit bằng Jaeger, xem block `email:` bên dưới): email cũng
  # đã được đưa vào spot — quote thì KHÔNG, vẫn pin on-demand ở đây vì xác nhận
  # thật là đồng bộ trên đường checkout.
  schedulingRules:
    nodeSelector:
      karpenter.sh/capacity-type: on-demand

components:
  # === Mandate-13 Phương án B (27-07-2026): NodePool `default` cho phép cả spot
  # lẫn on-demand (platform/karpenter/nodepool-default.yaml), nhưng an toàn mặc
  # định (on-demand) đã chuyển lên block `default:` ở trên — CHỈ 11 service dưới
  # đây được opt-in tường minh vào NodePool `spot` riêng (taint).
  #
  # Tất cả 11 service spot đều đáp ứng CÙNG MỘT chuẩn an toàn:
  #   PDB maxUnavailable=1 + replicas≥2 + preStop/terminationGrace
  #   (Karpenter chỉ được drain 1 pod tại 1 thời điểm; pod còn lại
  #   tiếp tục phục vụ trong khi pod bị evict reschedule trên node mới).
  # accounting/fraud-detection: Kafka consumer async, mỗi pod xử lý
  #   partition riêng → 2 pod không trùng message, PDB giữ ≥1 pod luôn
  #   active trong consumer group, không có khoảng downtime khi drain.
  #
  # Mọi service khác (luồng tiền thật sự đồng bộ như quote/shipping/currency/
  # cart/checkout/product-catalog/frontend, hoặc chưa tồn tại) đều an toàn theo
  # mặc định mà không cần khai báo gì thêm.

  ad:
    schedulingRules:
      tolerations:
        - key: techx.io/capacity
          value: spot
          effect: NoSchedule
      nodeSelector:
        techx.io/capacity: spot
  product-reviews:
    schedulingRules:
      tolerations:
        - key: techx.io/capacity
          value: spot
          effect: NoSchedule
      nodeSelector:
        techx.io/capacity: spot
  recommendation:
    schedulingRules:
      tolerations:
        - key: techx.io/capacity
          value: spot
          effect: NoSchedule
      nodeSelector:
        techx.io/capacity: spot
  image-provider:
    schedulingRules:
      tolerations:
        - key: techx.io/capacity
          value: spot
          effect: NoSchedule
      nodeSelector:
        techx.io/capacity: spot
  llm:
    schedulingRules:
      tolerations:
        - key: techx.io/capacity
          value: spot
          effect: NoSchedule
      nodeSelector:
        techx.io/capacity: spot
  frontend:
    # Next.js SSR là nút thắt user-facing: 200m limit bóp cổ (throttle 9.3% khi kịch
    # HPA max 6). Nới limit nâng trần bằng hiệu suất, không thêm node; giữ requests
    # 100m -> HPA target 70% không đổi. Max 6->10: trần đo 98rps@200u, gãy 280u vì
    # kịch max 6 (SSR ~20rps/pod).
    resources:
      limits:
        cpu: 500m
    # Mandate-13 (30-07-2026): max cũ (10) đã bị HPA chạm trần ở 450u trong bài load
    # test thật 28/07 — tổng request tại trần cũ không đủ vượt capacity 2-node hiện
    # có nên Karpenter không launch thêm node dù tải lên đỉnh. Nới trần (không đổi
    # request/target CPU) để cùng traffic đó tạo đủ replica/CPU request vượt capacity
    # node hiện tại, ép Karpenter scale-up thật. Xem tính toán trong ADR mandate-13.
    hpa:
      maxReplicas: 20
  # Checkout chain: limit=100m làm throttle khi checkout tải cao (đo 21/07 @60u:
  # email 95.7%, payment 34.2%, currency 29.1%) -> checkout gãy SLO sớm (~14rps vs
  # catalog 20rps). Nới limit nâng trần luồng ra tiền; requests right-size theo CPU
  # thực steady-state (avg ~50-55% so requests -> HPA có headroom, không flapping).
  # email/quote/shipping/payment trước kẹt 1 replica không HPA -> min2/max4
  # (email throttle 43%->2.1%, quote 58%->8%); min>=2 khớp chuẩn PDB×min-replicas
  # (INC-2). target CPU 70% dùng default.hpa.
  # Mandate-13 (re-audit 27-07-2026, dựa trên Jaeger thật — không dựa giả định
  # cũ): lấy 20 trace gần nhất của oteldemo.CheckoutService/PlaceOrder qua
  # continuous load-gen (`kubectl port-forward svc/jaeger 16686`, API
  # /jaeger/ui/api/traces) — CẢ 20/20 trace không hề có span nào gọi `email`.
  # `email` có Sinatra + OTel instrumentation ĐANG hoạt động (log xác nhận
  # "OpenTelemetry::Instrumentation::Sinatra... installed") và server-span tự
  # sinh cho MỌI request tới bất kể caller có instrument hay không — nên 0 span
  # nghĩa là 0 request tới thật, không phải do thiếu instrumentation. Log Puma/
  # Sinatra của pod `email` (chạy nhiều giờ) cũng không có 1 dòng access-log
  # nào. Kết luận: checkout hiện KHÔNG gọi email đồng bộ trên đường thật (khác
  # giả định cũ dựa trên biến env EMAIL_ADDR) — an toàn để opt-in spot.
  email:
    schedulingRules:
      tolerations:
        - key: techx.io/capacity
          value: spot
          effect: NoSchedule
      nodeSelector:
        techx.io/capacity: spot
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
    resources:
      requests:
        cpu: 100m   # dùng thật 62m (was 50m = under-request 124%)
      limits:
        cpu: 400m   # throttle 95.7%@100m — nghẽn nặng nhất chain
  # Mandate-13 (re-audit 27-07-2026, dựa trên log + Jaeger thật): `payment` KHÔNG
  # hề có RPC handler đồng bộ nào được checkout gọi trực tiếp — operations của
  # nó trên Jaeger chỉ có tcp/tls/dns.connect + "send domain.fulfillment.events"
  # + "process domain.checkout.orders" (100% Kafka/CDC). Log pod xác nhận rõ:
  # "Extracted orderId and userId in Payment consumer" rồi "Payment service
  # published fulfillment event..." — checkout publish event, `payment` consume
  # async, KHÔNG nằm trong span PlaceOrder (khác giả định cũ dựa trên biến env
  # PAYMENT_ADDR). Đã có sẵn PDB + topologySpread + replicas=2 + graceful-drain
  # từ ADR gốc (Decision 5, bảo vệ chung, không phải vì đồng bộ) — an toàn hơn cả
  # accounting/fraud-detection lúc opt-in (đã có PDB, không chỉ dựa "Kafka đệm").
  payment:
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 8   # Mandate-13 (30-07-2026): nới trần để ép node scale thật, xem comment ở frontend
    resources:
      requests:
        cpu: 80m    # dùng thật 44m (was 50m = 88%)
      limits:
        cpu: 300m   # throttle 34.2%@100m — luồng ra tiền, không được throttle
  # Mandate-13 (re-audit 27-07-2026): ĐÃ kiểm chứng lại bằng Jaeger — KHÔNG đổi
  # kết luận cũ. Trace thật của oteldemo.CheckoutService/PlaceOrder (20/20 mẫu)
  # cho thấy chuỗi checkout -> "POST" (gọi shipping) -> shipping "POST
  # /get-quote" -> quote "POST /getquote" -> "calculate-quote" nằm TRỌN trong
  # span prepareOrderItemsAndShippingQuoteFromCart, tức đồng bộ thật trên MỌI
  # request checkout, không phải giả định suông. Giữ nguyên pin on-demand qua
  # `default:` — không opt-in spot đợt này.
  quote:
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 8   # Mandate-13 (30-07-2026): nới trần để ép node scale thật, xem comment ở frontend
  shipping:
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 8   # Mandate-13 (30-07-2026): nới trần để ép node scale thật, xem comment ở frontend
  currency:
    hpa:
      maxReplicas: 8   # Mandate-13 (30-07-2026): nới trần để ép node scale thật, xem comment ở frontend
    resources:
      requests:
        cpu: 50m    # dùng 33m = 66%, giữ nguyên
      limits:
        cpu: 250m   # throttle 29.1%@100m — dùng chung nhiều flow
    # Currency keeps OTLP logs, metrics, and traces enabled. The service uses
    # bounded asynchronous processors so an unhealthy collector cannot block RPCs.
    # This is a full Helm env override, so retain every base environment variable.
    env:
      - name: CURRENCY_PORT
        value: "8080"
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4317
      - name: VERSION
        value: "{{ .Chart.AppVersion }}"
      - name: IPV6_ENABLED
        value: "false"
  cart:
    hpa:
      maxReplicas: 12   # Mandate-13 (30-07-2026): nới trần để ép node scale thật, xem comment ở frontend
    resources:
      requests:
        cpu: 60m    # dùng thật 37m (was 100m = over-request 37%)
      limits:
        cpu: 350m   # throttle 13.0%@200m — dù đã scale 3 replica
  checkout:
    hpa:
      maxReplicas: 10   # Mandate-13 (30-07-2026): nới trần để ép node scale thật, xem comment ở frontend
    resources:
      requests:
        cpu: 60m    # dùng thật 31m (was 100m = over-request 31%)
      limits:
        cpu: 350m   # throttle 12.9%@200m — core checkout
  product-catalog:
    hpa:
      maxReplicas: 12   # Mandate-13 (30-07-2026): nới trần để ép node scale thật, xem comment ở frontend
    resources:
      requests:
        cpu: 40m    # dùng 9m sau-shed (was 100m) — browse bị shed trước khi tới catalog
  # INFRA-OPTIMIZE P1: ml-guard req 1000m/pod là giữ chỗ ảo lớn nhất cụm — 2 pod
  # chiếm 2000m (36% tổng CPU requests, 25% trần NodePool cpu=8) trong khi dùng thật
  # ~290m/pod lúc có tải (đo 22/07 ~23h), idle chỉ 1m. Hạ request trả lại 1200m cho
  # scheduler; limit GIỮ 2000m vì model load (Presidio + classifier + NLI) cần burst.
  # Memory không đụng: dùng 1297-1517Mi/pod, request 1536Mi đang đúng cỡ.
  # HPA min2/max2 + PDB maxUnavailable=1 giữ nguyên (min>=2 khớp chuẩn INC-2).
  # Số 400m là ước lượng từ snapshot — phải đo lại lúc có inference traffic thật
  # (bài học mandate-19: ml-guard bị exclude khỏi loadtest baseline).
  ml-guard:
    # Mandate-13 (mở rộng sandbox spot, 27-07-2026): thêm vào NodePool spot riêng —
    # xem comment đầu file `components:`. Đã có PDB/topologySpread/preStop từ trước.
    schedulingRules:
      tolerations:
        - key: techx.io/capacity
          value: spot
          effect: NoSchedule
      nodeSelector:
        techx.io/capacity: spot
    resources:
      requests:
        cpu: 400m   # dùng thật ~290m/pod có tải (was 1000m = over-request 345%)
      limits:
        cpu: 2000m  # giữ — burst load model 25-90s (startupProbe đã cover)
  # 27-07-2026 (dựa trên đo trực tiếp hạ tầng thật): accounting và fraud-detection
  # là 2 Kafka consumer async, ngoài critical path storefront. Opt-in vào NodePool
  # spot với chuẩn đầy đủ: replicas=2 + PDB maxUnavailable=1 + preStop/grace
  # (fraud-detection thêm preStop trong values.yaml shared; accounting có sẵn).
  # replicas=2: Karpenter chỉ được drain 1 pod tại 1 thời điểm (PDB), pod còn lại
  # tiếp tục consume partition Kafka của nó — không có khoảng downtime. Kafka phân
  # partition theo consumer group nên 2 pod xử lý song song, không trùng message.
  accounting:
    replicas: 2
    podDisruptionBudget:
      maxUnavailable: 1
    schedulingRules:
      tolerations:
        - key: techx.io/capacity
          value: spot
          effect: NoSchedule
      nodeSelector:
        techx.io/capacity: spot
  fraud-detection:
    replicas: 2
    podDisruptionBudget:
      maxUnavailable: 1
    schedulingRules:
      tolerations:
        - key: techx.io/capacity
          value: spot
          effect: NoSchedule
      nodeSelector:
        techx.io/capacity: spot
  # Mandate-13 (re-audit 27-07-2026): `cart-consumer-worker` không có `service:`
  # (không nhận traffic trực tiếp từ ai), thuần Kafka consumer chờ event
  # "Payment and Shipping completed" rồi mới clear cart (log pod xác nhận: "...
  # Clearing cart for user X... Successfully cleared cart...") — chạy SAU khi
  # checkout đã trả response cho khách, không nằm trên đường chặn request nào.
  # Đã có PDB(maxUnavailable=1) + topologySpread + HPA min2/max4 +
  # terminationGracePeriodSeconds=30 từ trước (đủ để Kafka client commit offset
  # gọn trước khi bị SIGKILL) — không cần thêm preStop vì không có Service nào
  # cần gỡ endpoint.
  cart-consumer-worker:
    schedulingRules:
      tolerations:
        - key: techx.io/capacity
          value: spot
          effect: NoSchedule
      nodeSelector:
        techx.io/capacity: spot
