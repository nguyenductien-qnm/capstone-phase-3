# SecretStore trong namespace tailscale — cùng provider config với
# aws-secrets-manager của techx-tf1, dùng credential IRSA sẵn có của
# External Secrets Operator (không cần role riêng).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: tailscale
spec:
  provider:
    aws:
      region: us-east-1
      service: SecretsManager
