# Sinh Secret "operator-oauth" (client_id/client_secret) — tên và key này là
# default mà chart tailscale-operator tự tìm trong namespace của nó khi
# oauth.clientId không được set trong Helm values (xem
# platform/gitops/applications/tailscale-operator.yaml).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: ecommerce-dev-tailscale-oauth
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: ecommerce-dev-tailscale-oauth
        property: client_secret
