apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
  namespace: kube-system
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        # Mandate-13 (mở rộng sandbox, 27-07-2026): cho phép pool default nhận cả
        # spot lẫn on-demand, thay vì chỉ on-demand như trước. Mọi service luồng
        # tiền + service fragile (session in-memory, Kafka consumer ghép chặt data
        # cart) đều đã được ép nodeSelector karpenter.sh/capacity-type=on-demand
        # tường minh trong platform/gitops/environments/sandbox/values-application.yaml
        # — service KHÔNG có override đó (vd accounting, fraud-detection — async
        # Kafka consumer, chấp nhận gián đoạn ngắn) sẽ tự do rơi vào cả 2 loại,
        # Karpenter ưu tiên spot khi rẻ hơn. Đây là mô hình "an toàn = phải khai
        # báo loại trừ", khác opt-in cũ (an toàn = mặc định, phải khai báo mới được
        # spot) — rủi ro: service MỚI thêm sau này nếu quên khai báo on-demand sẽ
        # tự động thành spot-eligible ngay từ đầu.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["m6a", "c6a", "c7i"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large", "xlarge"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]
        # CDO-217/226 (M17-R2): buộc NodePool cân nhắc ≥2 AZ để mất trọn 1 AZ vẫn còn node.
        # minValues bỏ: mỗi NodeClaim launch chỉ pin 1 AZ cụ thể, minValues>=2 trên key
        # zone reject 100% mọi launch thật (đã xác nhận bằng A/B test 2 NodePool). Việc
        # trải AZ để lại cho pod topologySpreadConstraint (zone, maxSkew=1, DoNotSchedule).
        #
        # 27/07/2026: mở lại us-east-1a. Chẩn đoán cũ (f90d230: "1a fragment") đo lại
        # cho kết quả ĐẢO NGƯỢC — trạng thái lúc đó là nhất thời (2 node đang giữ prefix
        # ở 1a), không phải khiếm khuyết subnet. Số /28 trống đo 26-27/07: 1a = 12/16,
        # 1b = 1/16, 1c = 2/16; CloudTrail 26/07 ghi 1250 lỗi InsufficientCidrBlocks,
        # TOÀN BỘ từ node 1b/1c (ip-10-0-12-7 @1b chết NetworkNotReady 15:43Z), 0 lỗi
        # từ 1a. Loại 1a dồn 100% launch vào 2 subnet cạn khối — vòng tự siết.
        # Kèm PR này: Terraform thêm subnet node-1a/1b/1c (/20, tag discovery) — Karpenter
        # tự chọn subnet còn nhiều IP trống nhất trong AZ nên node mới vào /20 NGAY SAU
        # khi infra-cd apply. LƯU Ý: apply là bước THỦ CÔNG (workflow_dispatch, confirm
        # "apply-sandbox") — trước lúc đó 1a chỉ có /24 cũ, 12 khối /28 ≈ trần ~4-5 node
        # (mỗi node ăn 2-3 khối + warm prefix). Chạy apply trong CÙNG cửa sổ với merge.
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["us-east-1a", "us-east-1b", "us-east-1c"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      # Ép recycle định kỳ để node kéo AMI mới (AL2023 patch OS/kernel) — không có
      # cái này, node sống lâu chạy AMI cũ vô thời hạn trừ khi consolidation tình
      # cờ trigger. Pattern khớp TF3 (168h).
      expireAfter: 168h
      terminationGracePeriod: 24h
  limits:
    cpu: "16"
    memory: 64Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    budgets:
      - nodes: "1"
